name: budgeto-dev

services:
  postgres:
    image: postgres:16-alpine
    env_file:
      - .env
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '127.0.0.1:6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  migration:
    build:
      context: ../..
      dockerfile: infra/server.Dockerfile
      target: development
    env_file:
      - .env
    command: ['npm', 'run', 'migration:run']
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api:
    build:
      context: ../..
      dockerfile: infra/server.Dockerfile
      target: development
    env_file:
      - .env
    command: ['npm', 'run', 'dev:api']
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - ../..:/app
      - node_modules:/app/node_modules
      - import_data:/app/.data
    depends_on:
      migration:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    build:
      context: ../..
      dockerfile: infra/server.Dockerfile
      target: development
    env_file:
      - .env
    command: ['sh', '-c', 'npm run build:worker && npm run dev:worker']
    volumes:
      - ../..:/app
      - node_modules:/app/node_modules
      - import_data:/app/.data
    depends_on:
      migration:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  web:
    build:
      context: ../..
      dockerfile: infra/web.Dockerfile
      target: development
    env_file:
      - .env
    ports:
      - '127.0.0.1:5173:5173'
    volumes:
      - ../..:/app
      - node_modules:/app/node_modules

volumes:
  import_data:
  node_modules:
  postgres_data:
